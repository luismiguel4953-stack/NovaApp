name: Generar APK de NovaApp

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar NovaApp para Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Crear proyecto Android con Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK al repositorio de trabajo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./NovaApp-debug.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NovaApp-debug-apk
          path: NovaApp-debug.apk
          if-no-files-found: error

      - name: Publicar APK en Release para etiquetas v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovaApp-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
